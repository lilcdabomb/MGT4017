<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PinPoint prototype</title>
<style>
:root{--bg:#F3F4F6;--card:#fff;--ink:#1F2937;--mut:#4B5563;--line:#D1D5DB;--acc:#0E7490;--on:#fff;--tag:#CFFAFE;--tagi:#155E75;--map:#E5E7EB;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111827;--card:#1F2937;--ink:#F3F4F6;--mut:#9CA3AF;--line:#374151;--acc:#22D3EE;--on:#083344;--tag:#164E63;--tagi:#CFFAFE;--map:#273449;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#111827;--card:#1F2937;--ink:#F3F4F6;--mut:#9CA3AF;--line:#374151;--acc:#22D3EE;--on:#083344;--tag:#164E63;--tagi:#CFFAFE;--map:#273449;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink);line-height:1.45}
.w{max-width:1100px;margin:0 auto;padding:16px}
header{display:flex;flex-wrap:wrap;gap:8px 20px;align-items:center;border-bottom:1px solid var(--line);padding-bottom:10px}
.lg{font-weight:700;font-size:22px;color:var(--acc);margin-right:auto}
nav{display:flex;flex-wrap:wrap;gap:6px}
nav button{background:none;border:0;color:var(--ink);font-size:15px;padding:10px 12px;min-height:44px;border-radius:8px;cursor:pointer}
nav button.cur{background:var(--tag);color:var(--tagi);font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px}
.g{display:grid;gap:14px}.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}
.disc{grid-template-columns:260px 1fr 300px;align-items:start}
.ch{border:1px solid var(--mut);border-radius:22px;padding:10px 16px;background:var(--card);color:var(--ink);font-size:15px;min-height:44px;cursor:pointer;margin:0 6px 6px 0}
.ch.on{background:var(--acc);color:var(--on);border-color:var(--acc)}
.btn{background:var(--acc);color:var(--on);border:0;border-radius:8px;padding:10px 20px;font-size:16px;min-height:44px;cursor:pointer}
.btn.o{background:none;color:var(--ink);border:1px solid var(--mut)}
.tag{background:var(--tag);color:var(--tagi);border-radius:4px;padding:2px 8px;font-size:13px;display:inline-block}
.m{color:var(--mut);font-size:14px}
h1,h2,h3,p{margin:0}
h1{font-size:clamp(30px,5vw,44px);line-height:1.1}
label{display:block;margin:8px 0;font-size:15px}
input[type=text],input[type=number],select{width:100%;padding:10px;border:1px solid var(--mut);border-radius:6px;font-size:15px;background:var(--card);color:var(--ink)}
input[type=range]{width:100%}
.bar{height:8px;background:var(--line);border-radius:4px}.bar i{display:block;height:8px;background:var(--acc);border-radius:4px}
.pin circle{fill:var(--acc);cursor:pointer}.pin text{fill:var(--on);font-size:11px;font-weight:700;pointer-events:none}
.ev{cursor:pointer;text-align:left;width:100%;color:var(--ink);font:inherit}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
footer{margin-top:20px;font-size:13px;color:var(--mut)}
@media(max-width:820px){.g2,.g3,.disc{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="w">
<header><span class="lg">PinPoint</span><nav id="nv"></nav></header>
<main id="m" style="margin-top:16px"></main>
<footer>Prototype for MGT4017 Blog 2. Events, venues and reviews are fictional sample data. Try check-in code PIN123 on an event page to see verified reviews.</footer>
</div>
<script>
const $=s=>document.querySelector(s);
const esc=t=>String(t).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
const CATS=["Live music","Food and drink","Sport","Arts","Societies","Outdoors","Gaming"];
const EV=[
{id:1,n:"Open Mic Night",c:"Live music",p:0,d:0.8,w:"Fri 7pm",a:20,pr:0,rv:[{r:5,t:"Friendly crowd and great acts."}]},
{id:2,n:"Street Food Market",c:"Food and drink",p:5,d:1.5,w:"Sat 12pm",a:100,pr:1,rv:[{r:4,t:"Plenty of choice at student prices."}]},
{id:3,n:"5-a-side Social",c:"Sport",p:4,d:2.2,w:"Wed 6pm",a:170,pr:0,rv:[]},
{id:4,n:"Life Drawing Evening",c:"Arts",p:8,d:3.1,w:"Thu 7pm",a:240,pr:0,rv:[{r:4,t:"Relaxed and beginner friendly."}]},
{id:5,n:"Board Game Society Night",c:"Societies",p:0,d:0.6,w:"Tue 7pm",a:300,pr:0,rv:[]},
{id:6,n:"Sunrise Hike",c:"Outdoors",p:0,d:7.5,w:"Sun 7am",a:330,pr:0,rv:[]},
{id:7,n:"Indie Gig at The Cellar",c:"Live music",p:12,d:4,w:"Sat 8pm",a:50,pr:1,rv:[{r:5,t:"Brilliant atmosphere."}]},
{id:8,n:"Retro Gaming Night",c:"Gaming",p:3,d:1.9,w:"Fri 8pm",a:210,pr:0,rv:[]}];
const S={view:"home",step:0,int:[],bud:15,dis:5,tim:[],saved:[],ad:false,sel:null,rem:{},msg:"",tk:0};
let nid=100;
const ok=e=>(!S.int.length||S.int.includes(e.c))&&e.p<=S.bud&&e.d<=S.dis;
const tg=(a,v)=>{const i=a.indexOf(v);i<0?a.push(v):a.splice(i,1)};
const chips=(arr,sel,fn)=>arr.map(x=>'<button class="ch'+(sel.includes(x)?' on':'')+'" aria-pressed="'+sel.includes(x)+'" data-v="'+esc(x)+'" onclick="'+fn+'(this.dataset.v)">'+esc(x)+'</button>').join("");
const ti=v=>{tg(S.int,v);render()},tt=v=>{tg(S.tim,v);render()};
const sl=(id,pre,k,min,max,suf)=>'<label for="'+id+'">'+pre+'<b id="'+id+'v">'+S[k]+'</b>'+suf+'</label><input id="'+id+'" type="range" min="'+min+'" max="'+max+'" value="'+S[k]+'" oninput="$(\'#'+id+'v\').textContent=this.value" onchange="S.'+k+'=+this.value;if(S.view==\'discover\')render()">';
const go=v=>{location.hash=v};
const op=id=>{S.sel=id;S.tk=0;S.msg="";go("event")};
const sv=id=>{tg(S.saved,id);render()};
const nx=()=>{if(S.step<3){S.step++;render()}else go("discover")};
const bk=()=>{S.step--;render()};
const price=e=>e.p?"£"+e.p:"Free";
function home(){
const s=S.step,Q=["What are you into?","What is your budget per event?","How far will you travel?","When are you free?"];
const b=[chips(CATS,S.int,"ti"),sl("b1","Up to £","bud",0,50,""),sl("d1","Within ","dis",1,20," miles"),chips(["Weekday evenings","Weekends","Daytime"],S.tim,"tt")][s];
return '<section class="g g2" style="align-items:center;gap:32px;padding:20px 0"><div class="g"><p class="m">Home and onboarding</p><h1>Find your thing, near you, for your budget.</h1><p style="font-size:18px;color:var(--mut)">Answer a few quick questions and PinPoint maps the events that match your interests, your spend and your distance.</p></div>'+
'<div class="card g"><p class="m">Question '+(s+1)+' of 4</p><div class="bar"><i style="width:'+(s+1)*25+'%"></i></div><h2>'+Q[s]+'</h2><div>'+b+'</div><div class="row" style="justify-content:space-between">'+(s?'<button class="btn o" onclick="bk()">Back</button>':'<span></span>')+'<button class="btn" onclick="nx()">'+(s<3?'Next':'Show my events')+'</button></div></div></section>'+
'<section class="g g3"><div class="card"><h3>Saves time</h3><p class="m">See only events that match your profile.</p></div><div class="card"><h3>Saves money</h3><p class="m">Set the most you want to spend.</p></div><div class="card"><h3>Finds new things</h3><p class="m">Discover events you would not search for.</p></div></section>';
}
function disc(){
const L=EV.filter(ok),K=170/S.dis;
const pins=L.map(e=>{const r=e.a*Math.PI/180,x=300+e.d*K*Math.cos(r),y=200+e.d*K*Math.sin(r);return '<g class="pin" tabindex="0" role="button" aria-label="'+esc(e.n)+'" onclick="op('+e.id+')" onkeydown="if(event.key==\'Enter\')op('+e.id+')"><circle cx="'+x+'" cy="'+y+'" r="18"/><text x="'+x+'" y="'+(y+4)+'" text-anchor="middle">'+price(e)+'</text></g>'}).join("");
const list=L.length?L.map(e=>'<button class="card ev g" onclick="op('+e.id+')">'+(e.pr&&!S.ad?'<span class="tag">Promoted, matches your profile</span>':'')+'<h3>'+esc(e.n)+'</h3><p class="m">'+e.w+' / '+price(e)+' / '+e.d+' miles away</p></button>').join(""):'<div class="card">No events match. Try a higher budget or a longer distance.</div>';
return '<p class="m" style="margin-bottom:8px">Discover map</p><div class="g disc"><div class="card"><h2>Filters</h2><p class="m" style="margin:6px 0">Interests</p>'+chips(CATS,S.int,"ti")+sl("b2","Max spend: £","bud",0,50,"")+sl("d2","Distance: ","dis",1,20," miles")+'<p class="m">'+L.length+' events match</p></div>'+
'<svg viewBox="0 0 600 400" role="img" aria-label="Map of matching events" style="width:100%;border-radius:10px;border:1px solid var(--line)"><rect width="600" height="400" fill="var(--map)"/><path d="M0 120H600M0 290H600M150 0V400M430 0V400" stroke="var(--line)" stroke-width="6" fill="none"/><circle cx="300" cy="200" r="170" fill="none" stroke="var(--acc)" stroke-dasharray="5 4"/><circle cx="300" cy="200" r="7" fill="var(--ink)"/><text x="300" y="224" text-anchor="middle" font-size="12" fill="var(--ink)">You</text>'+pins+'</svg>'+
'<div class="g">'+list+'</div></div>';
}
function ev(){
const e=EV.find(x=>x.id==S.sel);if(!e)return disc();
const sd=S.saved.includes(e.id);
const rv=e.rv.length?e.rv.map(r=>'<div><span class="tag">Attended</span> <b>'+r.r+'/5</b><p class="m">'+esc(r.t)+'</p></div>').join(""):'<p class="m">No verified reviews yet.</p>';
return '<p class="m" style="margin-bottom:8px">Event details</p><div class="g g2" style="align-items:start"><div class="g"><div class="card g"><h1 style="font-size:32px">'+esc(e.n)+'</h1><p class="m">'+e.w+' / '+price(e)+' / '+e.d+' miles away / '+esc(e.c)+'</p><div class="row"><button class="ch" aria-pressed="'+sd+'" onclick="sv('+e.id+')">'+(sd?'Saved':'Save')+'</button><button class="btn" onclick="S.tk=1;render()">Get tickets</button></div>'+(S.tk?'<p class="tag">Prototype: ticket checkout would open here and PinPoint would earn commission.</p>':'')+'</div>'+
'<div class="card g"><h2>Verified reviews</h2>'+rv+'</div></div>'+
'<div class="card g"><h2>Review this event</h2><p class="m">Only people with proof of attendance can post a review.</p><label for="rc">Check-in code</label><input id="rc" type="text" placeholder="Try PIN123"><label for="rr">Rating</label><select id="rr"><option>5</option><option>4</option><option>3</option><option>2</option><option>1</option></select><label for="rt">Your review</label><input id="rt" type="text"><div><button class="btn" onclick="pr()">Post review</button></div>'+(S.msg?'<p class="tag" role="status">'+esc(S.msg)+'</p>':'')+'</div></div>';
}
function pr(){const e=EV.find(x=>x.id==S.sel);if($("#rc").value.trim().toUpperCase()!=="PIN123"){S.msg="Check-in code not recognised. Only attendees can review."}else{e.rv.push({r:+$("#rr").value,t:$("#rt").value||"Great event."});S.msg="Thanks, your verified review is posted."}render()}
function pf(){
const sv2=S.saved.map(id=>EV.find(x=>x.id==id)).filter(Boolean);
return '<p class="m" style="margin-bottom:8px">My PinPoint</p><div class="g g2" style="align-items:start"><div class="g"><div class="card g"><h2>Your interest profile</h2><div>'+(S.int.length?S.int.map(c=>'<span class="ch on">'+esc(c)+'</span>').join(""):'<span class="m">All categories</span>')+'</div><p class="m">Up to £'+S.bud+' per event, within '+S.dis+' miles</p><div><button class="btn o" onclick="S.step=0;go(\'home\')">Edit quiz answers</button></div></div>'+
'<div class="card g"><h2>Ad-free plan</h2><p class="m">Remove promoted listings from your map. Price to be decided.</p><div><button class="btn" onclick="S.ad=!S.ad;render()">'+(S.ad?'Ad-free is on (tap to turn off)':'Go ad-free')+'</button></div></div></div>'+
'<div class="card g"><h2>Saved events</h2>'+(sv2.length?sv2.map(e=>'<label><input type="checkbox" '+(S.rem[e.id]?'checked ':'')+'onchange="S.rem['+e.id+']=this.checked"> '+esc(e.n)+', '+e.w+': remind me</label>').join(""):'<p class="m">Nothing saved yet. Save events from the Discover page.</p>')+'</div></div>';
}
function og(){
const mine=EV.filter(e=>e.org),rvs=EV.reduce((a,e)=>a+e.rv.length,0);
return '<p class="m" style="margin-bottom:8px">Organiser portal</p><div class="g"><div class="g g3"><div class="card"><p class="m">Listed events</p><h2>'+EV.length+'</h2></div><div class="card"><p class="m">Saves by students</p><h2>'+S.saved.length+'</h2></div><div class="card"><p class="m">Verified reviews</p><h2>'+rvs+'</h2></div></div>'+
'<div class="g g2" style="align-items:start"><div class="card g"><h2>Add an event</h2><div><label for="on">Event name</label><input id="on" type="text"><label for="oc">Category</label><select id="oc">'+CATS.map(c=>'<option>'+c+'</option>').join("")+'</select><label for="op">Ticket price (£)</label><input id="op" type="number" min="0" value="0"><label for="od">Distance from city centre (miles)</label><input id="od" type="number" min="0.1" step="0.1" value="1"><label for="ow">Day and time</label><input id="ow" type="text" placeholder="Sat 7pm"><label><input id="opr" type="checkbox"> Promote this event to matching students</label></div><div><button class="btn" onclick="ad()">Publish event</button></div>'+(S.msg?'<p class="tag" role="status">'+esc(S.msg)+'</p>':'')+'</div>'+
'<div class="card g"><h2>Your events</h2>'+(mine.length?mine.map(e=>'<p>'+esc(e.n)+' <span class="m">/ '+e.w+(e.pr?' / promoted':'')+'</span></p>').join(""):'<p class="m">Events you publish appear here and on the Discover map for matching students.</p>')+'</div></div></div>';
}
function ad(){const n=$("#on").value.trim();if(!n){S.msg="Please add an event name.";render();return}
EV.push({id:++nid,n:n,c:$("#oc").value,p:Math.max(0,+$("#op").value||0),d:Math.max(0.1,+$("#od").value||1),w:$("#ow").value||"TBC",a:(nid*47)%360,pr:$("#opr").checked?1:0,rv:[],org:1});S.msg="Published. It now appears on Discover for matching students."; render()}
const V={home:home,discover:disc,event:ev,profile:pf,organiser:og};
const NAV=[["home","Home"],["discover","Discover"],["profile","My PinPoint"],["organiser","For organisers"]];
function render(){
if(!V[S.view])S.view="home";
$("#m").innerHTML=V[S.view]();
$("#nv").innerHTML=NAV.map(n=>'<button class="'+(S.view==n[0]?'cur':'')+'" onclick="S.msg=\'\';go(\''+n[0]+'\')">'+n[1]+'</button>').join("");
}
addEventListener("hashchange",()=>{S.view=location.hash.slice(1)||"home";scrollTo(0,0);render()});
S.view=location.hash.slice(1)||"home";render();
</script>
</body>
</html>
